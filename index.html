<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fajansowa 3 — 3D-тур</title>
<style>
  :root {
    --bg: #1b1916; --panel: rgba(26, 24, 21, .78); --ink: #f3eee6; --muted: #b9b0a3;
    --accent: #c98a5a; --line: rgba(243, 238, 230, .14);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .ui { position: fixed; z-index: 2; }
  #title { top: 16px; left: 16px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; backdrop-filter: blur(10px); }
  #title b { display: block; font-size: 15px; letter-spacing: .01em; }
  #title span { font-size: 12px; color: var(--muted); }
  #rooms { left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px;
           background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px);
           max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
  #rooms button { flex: none; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0;
                  padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  #rooms button:hover { background: rgba(255, 255, 255, .08); }
  #rooms button.on { background: var(--accent); color: #1b1916; }
  #map { top: 16px; right: 16px; width: 180px; padding: 8px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 12px; backdrop-filter: blur(10px); }
  #map svg { display: block; width: 100%; height: auto; cursor: crosshair; }
  #help { left: 16px; top: 78px; max-width: 230px; font-size: 12px; line-height: 1.45; color: var(--muted); padding: 8px 12px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #loader { inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; transition: opacity .5s; }
  #loader .bar { width: 220px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  #loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #loader p { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
  body.shot .ui { display: none !important; }
  @media (max-width: 720px) {
    #map { width: 120px; }
    #help { display: none; }
    #title { padding: 8px 10px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loader" class="ui"><div><p>Загружаем квартиру…</p><div class="bar"><i></i></div></div></div>
<div id="title" class="ui"><b>Fajansowa 3</b><span>Дизайн-проект · 49,8 м²</span></div>
<div id="map" class="ui"></div>
<div id="rooms" class="ui"></div>
<div id="help" class="ui">Тяните — осмотреться · WASD / стрелки — идти · клик по полу — перейти</div>
<script type="module" src="./main.js"></script>
</body>
</html>
